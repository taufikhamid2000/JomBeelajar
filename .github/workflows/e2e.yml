name: E2E smoke tests

# Runs the Playwright smoke suite (e2e/smoke.spec.ts) against a production
# build on every push to main. Public pages always run; the authenticated
# pages activate once E2E_TEST_EMAIL/E2E_TEST_PASSWORD secrets exist and
# skip cleanly until then.
#
# Needs NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY repo
# secrets (the real project — pages render live data). Until they're added
# the job reports a notice and skips the remaining steps instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      JOMBEELAJAR_API_URL: https://jombeelajar-api.taufikhamid.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check required secrets
        id: secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::notice title=E2E skipped::NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY repo secrets are not set — skipping the smoke suite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.skip != 'true'

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.secrets.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build
        if: steps.secrets.outputs.skip != 'true'
        run: npm run build

      - name: Run smoke tests
        if: steps.secrets.outputs.skip != 'true'
        run: npm run test:e2e
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          CI: true

      - uses: actions/upload-artifact@v4
        if: failure() && steps.secrets.outputs.skip != 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
